plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id 'org.jetbrains.kotlin.plugin.compose'
}

// gemstone 版本：优先取 -PgemstoneVersion，否则读 core/Cargo.toml 的 workspace version。
// 这样不用在本文件里硬编码版本号，避免与实际发布产物脱节。
def gemstoneVersion = project.findProperty('gemstoneVersion') ?: {
    // rootDir = tests/android/GemTest，回到 core/ 需要上 4 层。
    // 注意不是 core/gemstone/Cargo.toml —— 那里写的是 version = { workspace = true }
    def cargoToml = file("${rootDir}/../../../../Cargo.toml")
    def line = cargoToml.readLines().find { it.trim().startsWith('version') }
    line.split('"')[1]
}()

android {
    namespace "com.example.gemtest"
    compileSdk 35
    ndkVersion = "26.1.10909125"
    defaultConfig {
        applicationId "com.example.gemtest"
        minSdk 28
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    api "net.java.dev.jna:jna:5.18.1@aar"
    // 版本由 -PgemstoneVersion 传入，默认取 core/Cargo.toml 的 workspace version。
    // verify-release.sh 会传发布中的版本号，用本工程验证下游能否真正拉到制品。
    api "com.gemwallet.gemstone:gemstone:${gemstoneVersion}@aar"

    implementation("io.ktor:ktor-client-core:3.0.0")
    implementation("io.ktor:ktor-client-cio:3.0.0")

    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.0"
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation platform("androidx.compose:compose-bom:2025.05.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"

    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    androidTestImplementation platform("androidx.compose:compose-bom:2025.05.00")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}
